name: Lumina Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '22.21.0'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"

      - name: Install Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          RNLLAMA_SKIP_POSTINSTALL: '0'

      - name: Build Android APK
        run: yarn build:android
        env:
          ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'false'

      - name: Upload Lumina APK
        uses: actions/upload-artifact@v4
        with:
          name: lumina-apk
          path: android/app/build/outputs/apk/prodDebug/app-prod-debug.apk
          if-no-files-found: error
